<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Converse AI Assistant - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "paper": "#f9f7f1",
                    "paper-line": "#e0e8e4",
                    "ink-dark": "#2d2926",
                    "ink-light": "#7a7d7c",
                    "user-bubble": "#e8b0b0",
                    "primary": "#815500",
                    "primary-container": "#f4b044",
                },
                fontFamily: {
                    "sans": ["Inter", "system-ui", "sans-serif"],
                    "display": ["Outfit", "system-ui", "sans-serif"],
                }
            }
        }
    }
</script>
<style>
    body {
        font-family: 'Inter', sans-serif;
        background-color: #f9f7f1;
        background-image:
            linear-gradient(90deg, transparent 78px, #e8b0b0 78px, #e8b0b0 80px, transparent 80px),
            linear-gradient(transparent 27px, #e0e8e4 27px, #e0e8e4 28px, transparent 28px);
        background-size: 100% 28px;
        transition: background-color 0.25s ease;
    }
    :root {
        --bg-page: #f9f7f1; --bg-card: #ffffff; --text-primary: #2d2926;
        --text-secondary: #7a7d7c; --border: #e0e8e4; --line-h: #e0e8e4; --line-v: #e8b0b0;
    }
    html.dark {
        --bg-page: #1c1714; --bg-card: #261f1a; --text-primary: #ede8e2;
        --text-secondary: #9a9086; --border: #3a3028; --line-h: #2e2720; --line-v: #3d2a2a;
    }
    html.dark body {
        background-color: var(--bg-page);
        background-image:
            linear-gradient(90deg, transparent 78px, var(--line-v) 78px, var(--line-v) 80px, transparent 80px),
            linear-gradient(transparent 27px, var(--line-h) 27px, var(--line-h) 28px, transparent 28px);
        color: var(--text-primary);
    }
    html.dark .bg-white { background-color: var(--bg-card) !important; }
    html.dark .border-ink-dark { border-color: #5a4a3a !important; }
    html.dark .text-ink-dark { color: var(--text-primary) !important; }
    html.dark .text-ink-light { color: var(--text-secondary) !important; }
    html.dark .input-field { background-color: #211d19; border-color: var(--border); color: var(--text-primary); }
    html.dark .input-field::placeholder { color: var(--text-secondary); }
    html.dark .card-shadow { box-shadow: 6px 6px 0 #5a4a3a; }
    html.dark #page-theme-btn { background-color: #261f1a; border-color: #3a3028; color: #ede8e2; }
    html.dark .bg-gray-200 { background-color: #3a3028 !important; }
    .header-title { font-family: 'Outfit', sans-serif; }
    .card-shadow { box-shadow: 6px 6px 0 #2d2926; }
    .input-field {
        width: 100%; border: 1.5px solid var(--border); border-radius: 0.5rem;
        padding: 0.625rem 0.875rem; font-size: 0.875rem; outline: none;
        background-color: white; transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .input-field:focus { border-color: var(--accent-amber); box-shadow: 0 0 0 4px rgba(244,176,68,0.15); }
    .strength-bar div { height: 4px; border-radius: 2px; flex: 1; transition: background-color 0.3s; }
    
    /* Interactive Elements */
    .btn-interactive {
        transition: transform 0.15s ease, background-color 0.2s ease, opacity 0.2s ease;
    }
    .btn-interactive:active { transform: scale(0.97); }
    .card-shadow { box-shadow: 6px 6px 0 #2d2926; transition: box-shadow 0.3s ease, transform 0.3s ease; }
    @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeSlideIn 0.4s ease both; }
</style>

<!-- Floating theme toggle -->
<button id="page-theme-btn" onclick="togglePageTheme()"
    style="position:fixed;top:1rem;right:1rem;z-index:50;"
    class="flex items-center justify-center w-9 h-9 rounded-lg border border-paper-line bg-white shadow-sm hover:bg-gray-50 transition-colors text-ink-light btn-interactive">
    <span id="page-theme-icon" class="material-symbols-outlined text-[18px]">dark_mode</span>
</button>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md fade-in">

        <!-- Brand Header -->
        <div class="flex items-center gap-3 mb-8 justify-center">
            <div class="w-11 h-11 rounded-lg bg-user-bubble flex items-center justify-center shadow-sm">
                <span class="material-symbols-outlined text-ink-dark text-2xl font-bold">bolt</span>
            </div>
            <div>
                <h1 class="header-title text-xl font-bold leading-tight text-ink-dark">Converse AI Assistant</h1>
                <p class="text-[10px] font-medium text-ink-light tracking-widest uppercase">Energy Intelligence</p>
            </div>
        </div>

        <!-- Card -->
        <div class="bg-white border-2 border-ink-dark rounded-2xl p-8 card-shadow">
            <h2 class="header-title text-2xl font-bold text-ink-dark mb-1">Create Account</h2>
            <p class="text-sm text-ink-light mb-6">Join Converse AI and start querying your energy data.</p>

            <!-- Alert Message -->
            <div id="alert-msg" class="hidden text-sm font-semibold py-2.5 px-4 rounded-lg mb-5 flex items-center gap-2"></div>

            <form id="signup-form" class="space-y-4" novalidate>
                <!-- Name -->
                <div>
                    <label class="block text-xs font-bold text-ink-light uppercase tracking-wider mb-1.5" for="full-name">Full Name</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-ink-light text-[18px]">person</span>
                        <input class="input-field pl-10" id="full-name" placeholder="John Doe" type="text" autocomplete="name"/>
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-xs font-bold text-ink-light uppercase tracking-wider mb-1.5" for="email">Email Address</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-ink-light text-[18px]">mail</span>
                        <input class="input-field pl-10" id="email" placeholder="you@company.com" type="email" autocomplete="email"/>
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-xs font-bold text-ink-light uppercase tracking-wider mb-1.5" for="password">Password</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-ink-light text-[18px]">lock</span>
                        <input class="input-field pl-10 pr-10" id="password" placeholder="Min. 8 characters" type="password" autocomplete="new-password" oninput="checkStrength(this.value)"/>
                        <button type="button" onclick="togglePwd('password', 'toggle-pwd-icon')" class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-light hover:text-ink-dark transition-colors">
                            <span id="toggle-pwd-icon" class="material-symbols-outlined text-[18px]">visibility</span>
                        </button>
                    </div>
                    <!-- Strength Bar -->
                    <div class="strength-bar flex gap-1 mt-2" id="strength-bar">
                        <div id="s1" class="bg-gray-200"></div>
                        <div id="s2" class="bg-gray-200"></div>
                        <div id="s3" class="bg-gray-200"></div>
                        <div id="s4" class="bg-gray-200"></div>
                    </div>
                    <p id="strength-label" class="text-xs text-ink-light mt-1 h-4"></p>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-xs font-bold text-ink-light uppercase tracking-wider mb-1.5" for="confirm-password">Confirm Password</label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-ink-light text-[18px]">lock_reset</span>
                        <input class="input-field pl-10 pr-10" id="confirm-password" placeholder="Re-enter password" type="password" autocomplete="new-password"/>
                        <button type="button" onclick="togglePwd('confirm-password', 'toggle-cpwd-icon')" class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-light hover:text-ink-dark transition-colors">
                            <span id="toggle-cpwd-icon" class="material-symbols-outlined text-[18px]">visibility</span>
                        </button>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" id="submit-btn" class="w-full bg-ink-dark text-white font-bold py-3 px-4 rounded-lg hover:bg-ink-light flex items-center justify-center gap-2 mt-2 btn-interactive">
                    <span class="material-symbols-outlined text-[18px]">person_add</span> Create Account
                </button>
            </form>
        </div>

        <!-- Login Link -->
        <p class="text-center text-sm font-medium text-ink-light mt-6">
            Already have an account? 
            <a href="/" class="text-ink-dark underline decoration-2 decoration-user-bubble hover:text-ink-light transition-colors ml-1 btn-interactive inline-block">Sign in</a>
        </p>
    </div>

    <script>
        // Redirect if already logged in
        if (localStorage.getItem('supabase_session')) {
            window.location.href = '/chat_ui';
        }

        // Theme toggle
        const savedTheme = localStorage.getItem('voltiq_theme') || 'light';
        if (savedTheme === 'dark') document.documentElement.classList.add('dark');
        function togglePageTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('voltiq_theme', isDark ? 'dark' : 'light');
            document.getElementById('page-theme-icon').textContent = isDark ? 'light_mode' : 'dark_mode';
        }
        // Sync icon on load
        document.addEventListener('DOMContentLoaded', () => {
            const icon = document.getElementById('page-theme-icon');
            if (icon) icon.textContent = document.documentElement.classList.contains('dark') ? 'light_mode' : 'dark_mode';
        });

        function togglePwd(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        function checkStrength(pwd) {
            const bars = ['s1','s2','s3','s4'];
            const label = document.getElementById('strength-label');
            bars.forEach(id => document.getElementById(id).style.backgroundColor = '#e5e7eb');

            let score = 0;
            if (pwd.length >= 8) score++;
            if (/[A-Z]/.test(pwd)) score++;
            if (/[0-9]/.test(pwd)) score++;
            if (/[^A-Za-z0-9]/.test(pwd)) score++;

            const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e'];
            const labels = ['Weak', 'Fair', 'Good', 'Strong'];

            if (pwd.length === 0) { label.textContent = ''; return; }

            for (let i = 0; i < score; i++) {
                document.getElementById(bars[i]).style.backgroundColor = colors[score - 1];
            }
            label.textContent = labels[score - 1] || '';
            label.style.color = colors[score - 1] || '#7a7d7c';
        }

        function showAlert(msg, type) {
            const el = document.getElementById('alert-msg');
            const styles = {
                error:   'text-red-800 bg-red-50 border border-red-200',
                success: 'text-green-800 bg-green-50 border border-green-200',
                info:    'text-blue-800 bg-blue-50 border border-blue-200',
            };
            const icons = { error: 'error', success: 'check_circle', info: 'info' };
            el.className = `text-sm font-semibold py-2.5 px-4 rounded-lg mb-5 flex items-center gap-2 ${styles[type]}`;
            el.innerHTML = `<span class="material-symbols-outlined text-[18px]">${icons[type]}</span> ${msg}`;
            el.classList.remove('hidden');
        }

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('full-name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;
            const btn = document.getElementById('submit-btn');

            // Validations
            if (!name) return showAlert('Please enter your full name.', 'error');
            if (!email || !email.includes('@')) return showAlert('Please enter a valid email address.', 'error');
            if (password.length < 8) return showAlert('Password must be at least 8 characters.', 'error');
            if (password !== confirm) return showAlert('Passwords do not match.', 'error');

            btn.disabled = true;
            btn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span> Creating account...';

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();

                if (data.success) {
                    showAlert('Account created! Redirecting to login...', 'success');
                    setTimeout(() => window.location.href = '/', 1500);
                } else {
                    showAlert(data.message || 'Registration failed. Try a different email.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">person_add</span> Create Account';
                }
            } catch (err) {
                showAlert('Could not connect to server. Is the backend running?', 'error');
                btn.disabled = false;
                btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">person_add</span> Create Account';
            }
        });
    </script>

</body>
</html>
