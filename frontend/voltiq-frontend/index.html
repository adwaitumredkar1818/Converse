<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DarkKnights — Energy Intelligence RAG</title>
  <meta name="description" content="DarkKnights Energy Intelligence RAG — grounded AI answers on grid telemetry, energy consumption and policy." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ─── Design Tokens ─────────────────────────────────────────────── */
    :root {
      --bg:          #070A0F;
      --bg2:         #0D1117;
      --card:        #111827;
      --card-hover:  #172033;
      --border:      #1F2937;
      --border2:     #374151;
      --accent:      #22C55E;
      --accent2:     #38BDF8;
      --accent-glow: rgba(34,197,94,0.15);
      --text:        #F8FAFC;
      --muted:       #94A3B8;
      --muted2:      #64748B;
      --user-bubble: #172033;
      --user-border: #38BDF8;
      --bot-bubble:  #0D1117;
      --bot-border:  #22C55E;
      --danger:      #EF4444;
      --font-sans:   'Inter', system-ui, sans-serif;
      --font-mono:   'JetBrains Mono', 'Courier New', monospace;
      --sidebar-w:   260px;
      --header-h:    60px;
      --radius:      12px;
    }

    /* ─── Reset ────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: var(--font-sans); background: var(--bg); color: var(--text); overflow: hidden; }

    /* ─── Layout shell ──────────────────────────────────────────────── */
    #app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ─── Sidebar ───────────────────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      transition: transform 0.3s ease, width 0.3s ease;
      z-index: 100;
    }

    .sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 18px 16px;
      border-bottom: 1px solid var(--border);
    }

    /* DarkKnights SVG Shield Logo */
    .logo-icon {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      line-height: 1;
    }

    .logo-text .brand { font-size: 13px; font-weight: 700; color: var(--text); letter-spacing: 0.08em; }
    .logo-text .sub   { font-size: 9px;  font-weight: 500; color: var(--accent); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 2px; }

    .sidebar-new-chat {
      margin: 14px 12px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-sans);
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: calc(100% - 24px);
    }
    .sidebar-new-chat:hover  { background: #16a34a; }
    .sidebar-new-chat:active { transform: scale(0.98); }
    .sidebar-new-chat svg    { width: 16px; height: 16px; }

    .sidebar-section-label {
      font-size: 9px;
      font-weight: 600;
      color: var(--muted2);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 10px 16px 6px;
    }

    .sidebar-nav {
      list-style: none;
      padding: 0 8px;
    }

    .sidebar-nav li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .sidebar-nav li:hover  { background: var(--card-hover); color: var(--text); }
    .sidebar-nav li.active { background: var(--card); color: var(--accent); }
    .sidebar-nav li svg    { width: 16px; height: 16px; flex-shrink: 0; }

    .sidebar-status {
      margin: auto 0 0;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg2);
    }

    .status-header {
      font-size: 9px;
      font-weight: 600;
      color: var(--muted2);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
    }
    .status-row:last-child { border-bottom: none; }
    .status-label { font-size: 11px; color: var(--muted); }
    .status-value { font-size: 11px; font-weight: 600; color: var(--text); font-family: var(--font-mono); }
    .status-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; } 50% { opacity: 0.4; }
    }

    /* ─── Main content area ─────────────────────────────────────────── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      min-width: 0;
    }

    /* ─── Header ────────────────────────────────────────────────────── */
    #header {
      height: var(--header-h);
      min-height: var(--header-h);
      display: flex;
      align-items: center;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      gap: 12px;
    }

    #hamburger {
      display: none;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
    }
    #hamburger:hover { color: var(--text); background: var(--card); }
    #hamburger svg   { width: 22px; height: 22px; }

    .header-center { flex: 1; display: flex; align-items: center; gap: 10px; }

    .header-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .header-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--accent2);
      background: rgba(56,189,248,0.1);
      border: 1px solid rgba(56,189,248,0.25);
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.05em;
    }

    .connection-pill {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
    }
    .connection-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

    /* ─── Chat area ─────────────────────────────────────────────────── */
    #chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 0;
      scroll-behavior: smooth;
    }
    #chat-area::-webkit-scrollbar { width: 5px; }
    #chat-area::-webkit-scrollbar-track { background: transparent; }
    #chat-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

    #chat-inner {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 120px;
    }

    /* Welcome screen */
    #welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
      gap: 18px;
    }

    .welcome-logo {
      width: 64px;
      height: 64px;
      margin-bottom: 4px;
    }

    .welcome-title {
      font-size: 26px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--text) 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }

    .welcome-sub {
      font-size: 14px;
      color: var(--muted);
      max-width: 400px;
      line-height: 1.6;
    }

    .welcome-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .chip {
      font-size: 12px;
      padding: 7px 14px;
      border-radius: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--accent-glow);
    }

    /* Message bubbles */
    .msg-row { display: flex; gap: 12px; animation: fadeUp 0.25s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
    }
    .avatar.bot  { background: linear-gradient(135deg, #0D1117, #172033); border: 1.5px solid var(--bot-border); }
    .avatar.user { background: var(--user-bubble); border: 1.5px solid var(--user-border); color: var(--accent2); }

    .msg-bubble {
      max-width: 78%;
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
    }

    .msg-bubble.user {
      background: var(--user-bubble);
      border: 1px solid var(--user-border);
      color: var(--text);
      border-radius: var(--radius) 4px var(--radius) var(--radius);
    }

    .msg-bubble.bot {
      background: var(--bot-bubble);
      border: 1px solid var(--bot-border);
      color: var(--text);
      border-radius: 4px var(--radius) var(--radius) var(--radius);
      flex: 1;
    }

    .bot-header {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .bot-header::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    .msg-bubble.bot h1,
    .msg-bubble.bot h2,
    .msg-bubble.bot h3 { color: var(--text); font-size: 15px; margin: 12px 0 6px; }
    .msg-bubble.bot p   { margin: 6px 0; }
    .msg-bubble.bot ul,
    .msg-bubble.bot ol  { padding-left: 20px; margin: 6px 0; }
    .msg-bubble.bot li  { margin: 3px 0; }
    .msg-bubble.bot code {
      font-family: var(--font-mono);
      background: var(--card);
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 12px;
      color: var(--accent2);
    }
    .msg-bubble.bot pre {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .msg-bubble.bot pre code { background: none; border: none; padding: 0; }
    .msg-bubble.bot strong { color: var(--accent); }
    .msg-bubble.bot table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
    .msg-bubble.bot th { background: var(--card); color: var(--accent); padding: 6px 10px; border: 1px solid var(--border); text-align: left; }
    .msg-bubble.bot td { padding: 5px 10px; border: 1px solid var(--border); }

    .sources-footer {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .sources-label {
      font-size: 9px;
      font-weight: 700;
      color: var(--muted2);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-right: 4px;
    }

    .source-tag {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .latency-tag {
      margin-left: auto;
      font-size: 10px;
      font-family: var(--font-mono);
      color: var(--muted2);
    }

    /* Loading dots */
    .loading-dots { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
    .loading-dots span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: dotBounce 1.2s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes dotBounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30%          { transform: translateY(-6px); opacity: 1; }
    }

    /* ─── Input bar ─────────────────────────────────────────────────── */
    #input-bar {
      padding: 14px 20px 20px;
      background: linear-gradient(to top, var(--bg) 80%, transparent);
    }

    #input-wrap {
      max-width: 760px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 8px 6px 16px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #chat-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      font-size: 14px;
      font-family: var(--font-sans);
      color: var(--text);
      padding: 6px 0;
    }
    #chat-input::placeholder { color: var(--muted2); }

    #send-btn {
      background: var(--accent);
      border: none;
      border-radius: 8px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
    }
    #send-btn:hover  { background: #16a34a; }
    #send-btn:active { transform: scale(0.94); }
    #send-btn:disabled { background: var(--border2); cursor: not-allowed; }
    #send-btn svg { width: 18px; height: 18px; color: #000; }

    .input-footer {
      max-width: 760px;
      margin: 8px auto 0;
      text-align: center;
      font-size: 10px;
      color: var(--muted2);
      letter-spacing: 0.06em;
    }

    /* ─── Sidebar overlay (mobile) ──────────────────────────────────── */
    #sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 90;
    }

    /* ─── Responsive ────────────────────────────────────────────────── */
    @media (max-width: 700px) {
      #sidebar {
        position: fixed;
        top: 0; left: 0; bottom: 0;
        transform: translateX(-100%);
      }
      #sidebar.open { transform: translateX(0); }
      #sidebar-overlay.open { display: block; }
      #hamburger { display: flex; }
      #main { width: 100%; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Sidebar ───────────────────────────────────────────────────── -->
  <aside id="sidebar">
    <div class="sidebar-logo">
      <!-- DarkKnights shield SVG logo -->
      <svg class="logo-icon" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M18 2L4 8v10c0 8.5 6 16 14 18C26 34 32 26.5 32 18V8L18 2z" fill="#0D1117" stroke="#22C55E" stroke-width="1.5"/>
        <path d="M18 6L7 11v8c0 6.5 4.8 12.2 11 13.8C24.2 31.2 29 25.5 29 19v-8L18 6z" fill="#172033"/>
        <path d="M18 12v12M13 17l5-5 5 5" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="18" cy="22" r="1.5" fill="#38BDF8"/>
      </svg>
      <div class="logo-text">
        <span class="brand">DarkKnights</span>
        <span class="sub">Energy Intelligence</span>
      </div>
    </div>

    <button class="sidebar-new-chat" id="new-chat-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      New Chat
    </button>

    <div class="sidebar-section-label">Navigation</div>
    <ul class="sidebar-nav">
      <li class="active" id="nav-chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
        </svg>
        Energy Chat
      </li>
      <li id="nav-status">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        System Status
      </li>
      <li id="nav-settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        Settings
      </li>
    </ul>

    <!-- Live status panel -->
    <div class="sidebar-status">
      <div class="status-header">System Status</div>
      <div class="status-row">
        <span class="status-label">API</span>
        <span class="status-value"><span class="status-dot"></span> Online</span>
      </div>
      <div class="status-row">
        <span class="status-label">Model</span>
        <span class="status-value" id="stat-model">—</span>
      </div>
      <div class="status-row">
        <span class="status-label">Docs indexed</span>
        <span class="status-value" id="stat-docs">—</span>
      </div>
      <div class="status-row">
        <span class="status-label">Last update</span>
        <span class="status-value" id="stat-updated">—</span>
      </div>
    </div>
  </aside>

  <!-- Mobile overlay -->
  <div id="sidebar-overlay"></div>

  <!-- ── Main ──────────────────────────────────────────────────────── -->
  <div id="main">
    <header id="header">
      <button id="hamburger" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="header-center">
        <span class="header-title">Energy Intelligence RAG</span>
        <span class="header-badge">RAG · GPT-4o</span>
      </div>
      <div class="connection-pill">
        <span class="dot"></span>
        Connected
      </div>
    </header>

    <div id="chat-area">
      <div id="chat-inner">
        <!-- Welcome state injected here by JS, or messages -->
      </div>
    </div>

    <div id="input-bar">
      <div id="input-wrap">
        <input
          id="chat-input"
          type="text"
          placeholder="Ask about grid telemetry, energy consumption, or policy…"
          autocomplete="off"
        />
        <button id="send-btn" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-footer">DarkKnights RAG Pipeline · Grounded in energy telemetry &amp; policy documents</div>
    </div>
  </div>

</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
